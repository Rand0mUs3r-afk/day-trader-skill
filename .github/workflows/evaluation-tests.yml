name: Original workflow and simulated-account tests

on:
  workflow_dispatch:
  push:
    paths:
      - 'evaluation/**'
      - 'trader-*/**'
      - 'tests/**'
      - '.github/workflows/evaluation-tests.yml'
  pull_request:
    paths:
      - 'evaluation/**'
      - 'trader-*/**'
      - 'tests/**'
      - '.github/workflows/evaluation-tests.yml'

permissions:
  contents: read

jobs:
  offline-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run both suites against the full checkout
        shell: bash
        run: |
          logs="$RUNNER_TEMP/day-trader-evaluation-tests"
          mkdir -p "$logs"
          set +e
          python -m unittest discover -s tests -v > "$logs/upstream-tests.log" 2>&1
          upstream=$?
          python -m unittest discover -s evaluation -p 'test_*.py' -v > "$logs/evaluation-tests.log" 2>&1
          evaluation=$?
          cat "$logs/upstream-tests.log" "$logs/evaluation-tests.log"
          printf 'upstream_exit=%s\nevaluation_exit=%s\n' "$upstream" "$evaluation" > "$logs/test-exit-codes.txt"
          test "$upstream" -eq 0 && test "$evaluation" -eq 0
      - name: Preserve test logs even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-integration-test-logs
          path: ${{ runner.temp }}/day-trader-evaluation-tests/
          if-no-files-found: warn
